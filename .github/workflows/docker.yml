name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit frontend production dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Check CLI smoke command
        run: node cli/cli.js help

      - uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build local candidate for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          load: true
          tags: snip:scan

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: snip:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
